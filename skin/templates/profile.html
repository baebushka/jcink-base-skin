<!-- Starter Main Profile template (Jcink doesn't publish its default for this one). -->
<div class="tableborder" id="profile-<!-- |id| -->">
  <div class="maintitle">Viewing Profile: <!-- |name| --></div>
  <table width="100%" border="0" cellspacing="1" cellpadding="4">
    <tr>
      <td class="row4" width="1%" valign="top" align="center">
        <!-- |avatar| --><br />
        <span class="desc"><!-- |title| --></span>
      </td>
      <td class="row4" valign="top">
        <div id="profilename"><!-- |name| --></div>
        <span class="desc">
          Group: <!-- |group| --> &middot; Joined: <!-- |joined| --> &middot; <!-- |posts| --> posts &middot; <!-- |status| -->
        </span>
      </td>
    </tr>
    <tr><td class="pformstrip" colspan="2">Character Info</td></tr>
    <tr><td class="row2">Face Claim</td><td class="row4"><!-- |field_1| --></td></tr>
    <tr><td class="row2">Age</td><td class="row4"><!-- |field_2| --></td></tr>
    <tr><td class="row2">Occupation</td><td class="row4"><!-- |field_3| --></td></tr>
    <tr><td class="pformstrip" colspan="2">Personal Information</td></tr>
    <tr><td class="row2">Location</td><td class="row4"><!-- |location| --></td></tr>
    <tr><td class="row2">Interests</td><td class="row4"><!-- |interests| --></td></tr>
    <tr><td class="row2">Last Active</td><td class="row4"><!-- |last_activity| --></td></tr>
    <tr><td class="pformstrip" colspan="2">Signature</td></tr>
    <tr><td class="row4" colspan="2"><!-- |signature| --></td></tr>
  </table>
</div>
